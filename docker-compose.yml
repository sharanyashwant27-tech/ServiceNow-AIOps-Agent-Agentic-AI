services:
  api:
    image: servicenow-aiops:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: "1.0.0"
    ports:
      # Bind IPv4 loopback so Windows localhost does not hang on broken ::1 forwarding
      - "127.0.0.1:8910:8910"
    environment:
      PORT: 8910
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-servicenow-aiops-agentic}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      DATABASE_URL: postgresql+asyncpg://aiops:aiops@postgres:5432/aiops
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VECTOR_BACKEND: qdrant
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/aiops
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_FRAMEWORK: ${AGENT_FRAMEWORK:-langgraph}
      SMTP_HOST: ${SMTP_HOST:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      USE_INMEMORY_FALLBACK: "false"
      OCR_ENABLED: "true"
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
      - n8n

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j:/data

  n8n:
    image: n8nio/n8n:1.82.3
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    volumes:
      - n8n:/home/node/.n8n

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  qdrant:
  neo4j:
  n8n:
  grafana:
