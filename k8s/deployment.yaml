apiVersion: v1
kind: Namespace
metadata:
  name: servicenow-aiops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-api
  namespace: servicenow-aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-api
  template:
    metadata:
      labels:
        app: aiops-api
    spec:
      containers:
        - name: api
          image: servicenow-aiops:latest
          ports:
            - containerPort: 8910
          env:
            - name: PORT
              value: "8910"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: database_url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: secret_key
          readinessProbe:
            httpGet:
              path: /health
              port: 8910
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-api
  namespace: servicenow-aiops
spec:
  type: ClusterIP
  selector:
    app: aiops-api
  ports:
    - port: 8910
      targetPort: 8910
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops-ingress
  namespace: servicenow-aiops
spec:
  rules:
    - host: aiops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops-api
                port:
                  number: 8910
